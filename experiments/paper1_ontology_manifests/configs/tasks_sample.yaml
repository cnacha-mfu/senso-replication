  - task_id: "express-5104"
    repo: "expressjs/express"
    language: "javascript"
    issue_number: 5104
    issue_title: "Fix path parameter decoding for special characters"
    issue_description: >
      Route parameters containing encoded special characters (e.g., %2F)
      are not properly decoded, causing 404 errors on valid routes.
      The fix should decode path parameters after matching.
    pre_fix_commit: "b2c3d4e5f6a7"
    ground_truth_diff: |
      --- a/lib/router/layer.js
      +++ b/lib/router/layer.js
      @@ -45,6 +45,10 @@
       Layer.prototype.match = function match(path) {
         var match = this.regexp.exec(path);
         if (match) {
      +    for (var i = 1; i < match.length; i++) {
      +      if (typeof match[i] === 'string') {
      +        match[i] = decodeURIComponent(match[i]);
      +      }
      +    }
           this.params = {};
    test_commands:
      - "npm test"
    ground_truth_files_changed:
      - "lib/router/layer.js"
    human_manifest: |
      ## Evolution Context
      ### Module: lib/router/
      - **Evolution Phase**: Stabilization
      - **Recommendation**: Minimal changes. Extensive backward compatibility required.
    senso_manifest: |
      ## Evolution Context (auto-generated by SENSO)
      ### Module: lib/router/
      - **Evolution Phase**: Stabilization (since 2022-01, Law VI confirmed)
      - **Complexity Trend**: CC=8.7 avg, stable (Law II holding)
      - **Coupling Risk**: layer.js coupled to route.js and index.js (fan-out=5)
      - **Refactoring History**: Major rewrite attempted 2021, reverted. Incremental fixes only since.
      - **Law IV (Conservation of Org. Stability)**: Release cadence steady at 1/quarter
      - **Recommendation**: No new abstractions. Prefer fixing in-place. URL handling
        is a security-sensitive area — validate all decoded values.

  - task_id: "django-34521"
    repo: "django/django"
    language: "python"
    issue_number: 34521
    issue_title: "Fix QuerySet.union() crash with annotated fields"
    issue_description: >
      Using QuerySet.union() on querysets that include .annotate() raises
      a DatabaseError because the annotation columns are not aligned.
      The fix should strip annotations before the UNION SQL generation.
    pre_fix_commit: "c3d4e5f6a7b8"
    ground_truth_diff: |
      --- a/django/db/models/sql/query.py
      +++ b/django/db/models/sql/query.py
      @@ -200,6 +200,8 @@
       def combine(self, other, connector):
      +    if self.annotation_mask:
      +        self._strip_non_selected_annotations()
           combined = self.clone()
    test_commands:
      - "python -m pytest tests/queries/test_union.py -x -q"
    ground_truth_files_changed:
      - "django/db/models/sql/query.py"
    human_manifest: |
