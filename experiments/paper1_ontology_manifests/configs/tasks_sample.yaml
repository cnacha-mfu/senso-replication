      - **Complexity Trend**: CC stable at 12.3 avg (Law II: no increase without refactoring)
      - **Coupling Risk**: app.py fan-out=18 (p90 for project). Blueprint coupling=0.72
      - **Refactoring History**: 3 refactorings in 2023, last reduced CC by 8%
