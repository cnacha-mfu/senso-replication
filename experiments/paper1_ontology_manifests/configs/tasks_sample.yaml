      - **Complexity Trend**: Stable, cyclomatic complexity flat over 12 months
      - **Coupling Risk**: app.py has fan-out=18, highest in codebase
      - **Recommendation**: Minimal changes preferred. Avoid adding new imports.
    senso_manifest: |
      ## Evolution Context (auto-generated by SENSO)
