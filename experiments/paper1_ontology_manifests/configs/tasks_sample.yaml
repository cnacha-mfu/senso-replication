  - task_id: "flask-5231"
    repo: "pallets/flask"
    language: "python"
    issue_number: 5231
    issue_title: "Fix incorrect error handler lookup for blueprint errors"
    issue_description: >
      When a blueprint registers an error handler for a specific exception,
      the app-level handler is incorrectly invoked instead. The fix should
      ensure blueprint-level error handlers take precedence.
    pre_fix_commit: "a1b2c3d4e5f6"
    ground_truth_diff: |
      --- a/src/flask/app.py
      +++ b/src/flask/app.py
      @@ -120,7 +120,9 @@
       def find_handler(self, exc):
      -    handler = self.error_handlers.get(type(exc))
      +    if self.blueprints:
      +        handler = self._find_blueprint_handler(exc)
      +    else:
      +        handler = self.error_handlers.get(type(exc))
           return handler
    test_commands:
      - "python -m pytest tests/test_blueprints.py -x -q"
      - "python -m pytest tests/test_error_handling.py -x -q"
    ground_truth_files_changed:
      - "src/flask/app.py"
    human_manifest: |
      ## Evolution Context
