# Manifest Generation Configuration — Paper 1, Phase 2
# SENSO Framework: Evolution-Aware CLAUDE.md Generator
#
# Usage:
#   python manifests/generator/generate.py --config experiments/paper1_ontology_manifests/configs/generation.yaml --repo owner/name
#   python manifests/generator/generate.py --config experiments/paper1_ontology_manifests/configs/generation.yaml --repo owner/name --no-llm

# Fuseki triple store connection
fuseki:
  fuseki_url: "http://localhost:3030"
  dataset: "seo"

# LLM synthesis settings (NVIDIA NIM)
llm:
  model: "meta/llama-3.3-70b-instruct"
  temperature: 0.2
  max_tokens: 600
  # API key loaded from NVIDIA_API_KEY env var (see .env)
  # Endpoint: https://integrate.api.nvidia.com/v1

# Output settings
output:
  output_dir: "manifests/generated/"
  save_json_sidecar: true        # Also save structured JSON alongside CLAUDE.md

# Manifest content settings
manifest:
  include_header: true           # Include "Evolution Context (auto-generated by SENSO)" header
  include_footer: true           # Include SENSO attribution footer
  include_timestamp: true        # Include generation timestamp
  sections:                      # Which sections to include per module
    - evolution_phase
    - complexity_trend
    - coupling_risk
    - refactoring_history
    - agent_contribution
    - recommendation
